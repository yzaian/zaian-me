<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yahia Zaian — Latest Release</title>
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,700;0,900;1,900&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root{
      --bg:#0a0a0a; --card:#141414;
      --border:rgba(255,255,255,.08); --muted:rgba(255,255,255,.5);
    }
    html, body { height:100%; }
    body{
      background:var(--bg); color:#fff;
      font-family:'Space Grotesk', sans-serif;
      min-height:100svh;
      display:flex; flex-direction:column;
      padding:1.5rem;
    }

    .home-btn{
      align-self:flex-start;
      display:inline-flex; align-items:center; gap:.55rem;
      padding:.55rem 1rem;
      border:1px solid rgba(255,255,255,.18);
      border-radius:999px;
      color:#fff; text-decoration:none;
      font-size:.7rem; letter-spacing:.18em; text-transform:uppercase;
      background:rgba(255,255,255,.02);
      transition:background .2s, border-color .2s;
    }
    .home-btn:hover{ background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.35); }
    .home-btn svg{ width:14px; height:14px; }

    main{
      flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:2.5rem 0;
    }
    .wrap{ width:100%; max-width:430px; }

    .cover-wrap{ position:relative; aspect-ratio:1/1; border-radius:14px; overflow:hidden; background:#1a1a1a; margin-bottom:1.8rem; box-shadow:0 30px 80px -20px rgba(0,0,0,.6); }
    .cover-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
    .cover-placeholder{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:.72rem; letter-spacing:.2em; text-transform:uppercase; }

    h1.title{
      font-family:'Archivo', sans-serif;
      font-weight:900; font-style:italic;
      font-size:clamp(1.8rem, 6vw, 2.4rem);
      letter-spacing:-.02em; text-transform:uppercase;
      text-align:center; line-height:1.05;
      margin-bottom:.55rem;
    }
    .subtitle{
      text-align:center; color:var(--muted);
      font-size:.72rem; letter-spacing:.22em; text-transform:uppercase;
      margin-bottom:2.2rem;
    }

    .links{ display:flex; flex-direction:column; gap:.65rem; }
    .platform{
      display:flex; align-items:center; gap:1rem;
      padding:1rem 1.3rem;
      background:var(--card); border:1px solid var(--border); border-radius:12px;
      color:#fff; text-decoration:none;
      transition:transform .15s, background .2s, border-color .2s;
    }
    .platform:hover{ background:#1c1c1c; border-color:rgba(255,255,255,.18); transform:translateY(-1px); }
    .platform-icon{ width:34px; height:34px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:1.25rem; border-radius:8px; background:rgba(255,255,255,.04); }
    .platform-label{ flex:1; font-size:.85rem; font-weight:500; letter-spacing:.01em; }
    .platform-arrow{ opacity:.4; font-size:.95rem; transition:transform .2s, opacity .2s; }
    .platform:hover .platform-arrow{ opacity:1; transform:translate(2px,-2px); }

    .empty{ text-align:center; color:var(--muted); font-size:.78rem; line-height:1.6; padding:2rem 1rem; border:1px dashed var(--border); border-radius:12px; }
    .empty strong{ color:#fff; font-weight:500; }

    footer{ text-align:center; padding:1.5rem 0 .5rem; color:rgba(255,255,255,.25); font-size:.65rem; letter-spacing:.18em; text-transform:uppercase; }

    @media (max-width:480px){
      body{ padding:1rem; }
      .wrap{ max-width:100%; }
    }
  </style>
</head>
<body>

<a class="home-btn" href="/" title="Back to main site">
  <svg viewBox="0 0 20 20" fill="none"><path d="M11 4L5 10L11 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  Main Site
</a>

<main>
  <div class="wrap" id="root">
    <div class="empty">Loading…</div>
  </div>
</main>

<footer>Yahia Zaian · <span id="year">2026</span></footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

// Icon mapping — extendable from dashboard via "icon" field per link
const ICON_DEFAULTS = {
  spotify: 'fa-brands fa-spotify',
  apple:   'fa-brands fa-apple',
  'apple music': 'fa-brands fa-apple',
  itunes:  'fa-brands fa-itunes-note',
  soundcloud: 'fa-brands fa-soundcloud',
  youtube: 'fa-brands fa-youtube',
  'youtube music': 'fa-brands fa-youtube',
  deezer:  'fa-brands fa-deezer',
  bandcamp: 'fa-brands fa-bandcamp',
  tidal:   'fa-solid fa-wave-square',
  amazon:  'fa-brands fa-amazon',
  anghami: 'fa-solid fa-music',
  instagram: 'fa-brands fa-instagram',
  tiktok:  'fa-brands fa-tiktok',
  twitter: 'fa-brands fa-x-twitter',
  x:       'fa-brands fa-x-twitter',
  facebook: 'fa-brands fa-facebook',
  default: 'fa-solid fa-link',
};
function iconFor(link){
  if (link.icon) return link.icon;
  const k = (link.label || '').trim().toLowerCase();
  return ICON_DEFAULTS[k] || ICON_DEFAULTS.default;
}

fetch('/api/content')
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .catch(() => fetch('/content.json').then(r => r.json()))
  .then(data => {
    const r = data.release || {};
    const root = document.getElementById('root');

    const isEmpty = !r.cover && !r.title && (!r.links || r.links.length === 0);
    if (isEmpty) {
      root.innerHTML = `<div class="empty">No release published yet.<br><strong>Open the dashboard → Release Page to add one.</strong></div>`;
      return;
    }

    const coverHTML = r.cover
      ? `<div class="cover-wrap"><img src="${r.cover}" alt="${r.title || 'Release cover'}"></div>`
      : `<div class="cover-wrap"><div class="cover-placeholder">No Cover</div></div>`;

    const linksHTML = (r.links || []).filter(l => l.url).map(l => `
      <a class="platform" href="${l.url}" target="_blank" rel="noopener">
        <span class="platform-icon"><i class="${iconFor(l)}"></i></span>
        <span class="platform-label">${l.label || 'Listen'}</span>
        <span class="platform-arrow">↗</span>
      </a>`).join('');

    root.innerHTML = `
      ${coverHTML}
      ${r.title ? `<h1 class="title">${r.title}</h1>` : ''}
      ${r.subtitle ? `<div class="subtitle">${r.subtitle}</div>` : ''}
      ${linksHTML ? `<div class="links">${linksHTML}</div>` : ''}
    `;
    if (r.title) document.title = r.title + ' — Yahia Zaian';
  })
  .catch(() => {
    document.getElementById('root').innerHTML = `<div class="empty">Could not load release content.</div>`;
  });
</script>
</body>
</html>
