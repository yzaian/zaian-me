<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project — Yahia Zaian</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,700;0,900;1,900&family=Space+Grotesk:wght@300;400;500&family=Cormorant+Garamond:ital,wght@1,300;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--black:#000;--white:#fff;--border:rgba(255,255,255,.08);--muted:rgba(255,255,255,.36);}
    html{overflow-x:hidden}
    body{background:var(--black);color:var(--white);font-family:'Space Grotesk',sans-serif;overflow-x:hidden;cursor:none;}

    #curtain{position:fixed;inset:0;z-index:9000;background:var(--black);pointer-events:none;animation:curtain-fallback 3s forwards;}
    @keyframes curtain-fallback{0%,90%{opacity:1}100%{opacity:0;pointer-events:none}}

    #cursor{position:fixed;width:12px;height:12px;border-radius:50%;background:#fff;pointer-events:none;mix-blend-mode:difference;z-index:9999;transform:translate(-50%,-50%);transition:opacity .2s;will-change:left,top;}

    /* ── NAV ── */
    nav{position:fixed;top:0;left:0;right:0;z-index:500;display:flex;align-items:center;justify-content:space-between;padding:1.6rem 3rem;mix-blend-mode:normal;}
    nav::before{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,1) 0%,rgba(0,0,0,.7) 55%,transparent 100%);pointer-events:none;z-index:-1;}
    /* ─── NAV FRAME ─────────────────────────── */
    .nav-frame{display:flex;align-items:center;border:1px solid rgba(255,255,255,.32);border-radius:8px;}
    .nav-frame-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;background:none;border:none;cursor:pointer;color:var(--white);text-decoration:none;opacity:.55;transition:opacity .2s,background .25s;}
    .nav-frame-btn:hover{opacity:1;background:rgba(255,255,255,.07);}
    .nav-frame-sep{width:1px;height:18px;background:rgba(255,255,255,.18);flex-shrink:0;align-self:center;}
    .nav-links{display:flex;gap:2.5rem;list-style:none;}
    .nav-links a{color:var(--white);text-decoration:none;font-size:.68rem;letter-spacing:.25em;text-transform:uppercase;opacity:.45;transition:opacity .25s;}
    .nav-links a:hover{opacity:1;}
    @media(max-width:600px){.nav-links{gap:1.2rem;}.nav-links a{font-size:.6rem;letter-spacing:.15em;}}
    @media(max-width:400px){.nav-links{gap:.7rem;}}

    /* ── HERO IMAGE ── */
    .proj-hero{width:100%;height:72svh;min-height:400px;overflow:hidden;position:relative;margin-top:0;}
    .proj-hero img{width:100%;height:100%;object-fit:cover;display:block;}
    .proj-hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 55%,rgba(0,0,0,.6) 100%);}

    /* ── INFO ── */
    .proj-info{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--border);}
    .proj-info-l{padding:4rem 3rem;border-right:1px solid var(--border);}
    .proj-info-r{padding:4rem 3rem;display:flex;flex-direction:column;justify-content:space-between;}
    .proj-cat{font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-bottom:1.2rem;display:flex;align-items:center;gap:.7rem;}
    .proj-cat::before{content:'';display:block;width:18px;height:1px;background:currentColor;}
    .proj-title{font-family:'Archivo',sans-serif;font-weight:900;font-style:italic;font-size:clamp(3rem,7vw,7rem);line-height:.88;letter-spacing:-.03em;text-transform:uppercase;margin-bottom:2rem;}
    .proj-desc{font-size:.9rem;line-height:1.85;color:var(--muted);max-width:480px;}
    .proj-link{display:inline-flex;align-items:center;gap:.7rem;margin-top:2.5rem;padding:.7rem 1.6rem;border:1px solid rgba(255,255,255,.25);border-radius:2px;font-size:.65rem;letter-spacing:.22em;text-transform:uppercase;color:var(--white);text-decoration:none;transition:background .25s,border-color .25s;}
    .proj-link:hover{background:var(--white);color:var(--black);border-color:var(--white);}
    .proj-meta{display:flex;flex-direction:column;gap:1.5rem;}
    .proj-meta-item{}
    .proj-meta-label{font-size:.58rem;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem;}
    .proj-meta-val{font-size:.88rem;font-weight:500;}

    /* ── GALLERY ── */
    .proj-gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;background:var(--border);}
    .proj-gallery.single{grid-template-columns:1fr;}
    .proj-gallery.triple{grid-template-columns:repeat(3,1fr);}
    .proj-gallery.quad{grid-template-columns:repeat(2,1fr);}
    .proj-gallery.quint .gallery-item:first-child{grid-column:1/-1;}
    .proj-gallery.quint{grid-template-columns:repeat(2,1fr);}
    .gallery-item{overflow:hidden;aspect-ratio:4/3;background:#0d0d0d;}
    .gallery-item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s cubic-bezier(.76,0,.24,1);}
    .gallery-item:hover img{transform:scale(1.04);}

    /* ── BACK ── */
    .proj-back{padding:5rem 3rem;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
    .back-link{font-family:'Archivo',sans-serif;font-weight:900;font-style:italic;font-size:clamp(1.8rem,4vw,3.5rem);letter-spacing:-.02em;text-transform:uppercase;color:var(--white);text-decoration:none;transition:opacity .25s;}
    .back-link:hover{opacity:.55;}
    .back-num{font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);}

    /* ── NOT FOUND ── */
    .not-found{height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;color:var(--muted);}

    /* ── RESPONSIVE ── */
    @media(max-width:768px){
      nav{padding:1.2rem 1.5rem;}
      .proj-info{grid-template-columns:1fr;}
      .proj-info-l{border-right:none;border-bottom:1px solid var(--border);padding:3rem 1.5rem;}
      .proj-info-r{padding:2.5rem 1.5rem;}
      .proj-gallery{grid-template-columns:1fr;}
      .proj-gallery.triple{grid-template-columns:1fr;}
      .proj-back{padding:3rem 1.5rem;flex-direction:column;align-items:flex-start;gap:1rem;}
    }
  </style>
</head>
<body>

<div id="curtain"></div>
<div id="cursor"></div>

<nav id="nav">
  <div class="nav-frame">
    <a class="nav-frame-btn" href="index.html" onclick="navigate(event,'index.html')" title="Home">
      <svg width="18" height="16" viewBox="0 0 22 20" fill="none"><path d="M1 9L11 1L21 9V19H14V13H8V19H1V9Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </a>
    <span class="nav-frame-sep"></span>
    <button class="nav-frame-btn" onclick="navigateBack(event)" title="Go back">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M12 4L6 10L12 16" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <ul class="nav-links">
    <li><a href="design.html" onclick="navigate(event,'design.html')">Design</a></li>
    <li><a href="music.html" onclick="navigate(event,'music.html')">Music</a></li>
    <li><a href="contact.html" onclick="navigate(event,'contact.html')">Contact</a></li>
  </ul>
</nav>

<div id="proj-wrap"></div>

<script>
const lenis = new Lenis({ duration: 1.3, easing: t => Math.min(1, 1.001 - Math.pow(2, -10*t)) });
function raf(t){lenis.raf(t);requestAnimationFrame(raf);}requestAnimationFrame(raf);
lenis.on('scroll', ScrollTrigger.update);
gsap.ticker.add(t=>lenis.raf(t*1000));
gsap.ticker.lagSmoothing(0);
gsap.registerPlugin(ScrollTrigger);

/* ── Curtain ── */
gsap.set('#curtain',{scaleY:1,transformOrigin:'top'});
gsap.to('#curtain',{scaleY:0,duration:.9,ease:'power3.inOut',delay:.05,onComplete:()=>{
  gsap.from('#nav',{y:-20,opacity:0,duration:.6,ease:'power2.out'});
}});
setTimeout(function(){var c=document.getElementById('curtain');if(c){c.style.opacity='0';c.style.pointerEvents='none';}},2500);

/* ── Custom cursor ── */
const cur=document.getElementById('cursor');
document.addEventListener('mousemove',e=>{cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';});
document.addEventListener('mouseleave',()=>{cur.style.opacity='0';});
document.addEventListener('mouseenter',()=>{cur.style.opacity='1';});

/* ── Load project ── */
const params = new URLSearchParams(location.search);
const projId = params.get('id');

fetch('/api/content')
  .then(r=>{if(!r.ok)throw new Error();return r.json();})
  .catch(()=>fetch('/content.json').then(r=>r.json()))
  .then(data=>{
    const p = (data.design?.projects||[]).find(x=>x.id===projId);
    if(!p){ document.getElementById('proj-wrap').innerHTML='<div class="not-found"><p>Project not found.</p></div>'; return; }
    document.title = p.name + ' — Yahia Zaian';
    renderProject(p, data.design?.projects||[]);
  })
  .catch(()=>{ document.getElementById('proj-wrap').innerHTML='<div class="not-found"><p>Could not load project.</p></div>'; });

function renderProject(p, allProjects) {
  const images = p.images || [];
  const galleryClass = images.length === 1 ? 'single'
    : images.length === 3 ? 'triple'
    : images.length === 4 ? 'quad'
    : images.length === 5 ? 'quint'
    : '';

  // Find prev/next project
  const idx = allProjects.findIndex(x=>x.id===p.id);
  const next = allProjects[(idx+1) % allProjects.length];

  const galleryHTML = images.length ? `
    <div class="proj-gallery ${galleryClass}">
      ${images.map((img,i)=>`
        <div class="gallery-item">
          <img src="${img.startsWith('http') ? img : '/' + img}" alt="${p.name}" ${i>2?'loading="lazy"':''} onerror="this.style.display='none';this.parentElement.style.background='#1a1a1a';">
        </div>`).join('')}
    </div>` : '';

  document.getElementById('proj-wrap').innerHTML = `
    <div class="proj-hero">
      <img src="${p.image && p.image.startsWith('http') ? p.image : '/' + p.image}" alt="${p.name}">
      <div class="proj-hero-overlay"></div>
    </div>

    <div class="proj-info">
      <div class="proj-info-l">
        <div class="proj-cat">${p.categoryLabel}</div>
        <h1 class="proj-title">${p.name}</h1>
        ${p.description ? `<p class="proj-desc">${p.description.replace(/\n/g,'<br>')}</p>` : ''}
        ${p.link ? `<a class="proj-link" href="${p.link}" target="_blank">View Project ↗</a>` : ''}
      </div>
      <div class="proj-info-r">
        <div class="proj-meta">
          <div class="proj-meta-item">
            <div class="proj-meta-label">Category</div>
            <div class="proj-meta-val">${p.categoryLabel}</div>
          </div>
          <div class="proj-meta-item">
            <div class="proj-meta-label">Designer</div>
            <div class="proj-meta-val">Yahia Zaian</div>
          </div>
        </div>
      </div>
    </div>

    ${galleryHTML}

    <div class="proj-back">
      <a class="back-link" href="project.html?id=${next.id}" onclick="navigateTo(event,'project.html?id=${next.id}')">Next: ${next.name} →</a>
      <span class="back-num">Project ${String(allProjects.findIndex(x=>x.id===p.id)+1).padStart(2,'0')} / ${String(allProjects.length).padStart(2,'0')}</span>
    </div>`;

  // Reveal hero image
  gsap.from('.proj-hero img',{scale:1.06,duration:1.2,ease:'power3.out',delay:.3});
  // Reveal info
  gsap.from('.proj-cat',{y:20,opacity:0,duration:.7,ease:'power2.out',delay:.5});
  gsap.from('.proj-title',{y:40,opacity:0,duration:.9,ease:'power3.out',delay:.6});
  gsap.from('.proj-desc',{y:20,opacity:0,duration:.7,ease:'power2.out',delay:.75});
  gsap.from('.proj-link',{y:16,opacity:0,duration:.6,ease:'power2.out',delay:.85});
  gsap.from('.proj-info-r',{y:20,opacity:0,duration:.7,ease:'power2.out',delay:.65});
  // Gallery scroll reveals
  document.querySelectorAll('.gallery-item').forEach((el,i)=>{
    gsap.from(el,{scrollTrigger:{trigger:el,start:'top 88%'},y:40,opacity:0,duration:.7,delay:i*.08,ease:'power2.out'});
  });
  gsap.from('.proj-back',{scrollTrigger:{trigger:'.proj-back',start:'top 90%'},y:30,opacity:0,duration:.7,ease:'power2.out'});
}

/* ── Page transition ── */
function navigate(e,url){e.preventDefault();lenis.stop();gsap.to('#curtain',{scaleY:1,transformOrigin:'bottom',duration:.65,ease:'power3.inOut',onComplete:()=>window.location.href=url});}
function navigateTo(e,url){e.preventDefault();lenis.stop();gsap.to('#curtain',{scaleY:1,transformOrigin:'bottom',duration:.65,ease:'power3.inOut',onComplete:()=>window.location.href=url});}
window.navigate=navigate;
function navigateBack(e){e.preventDefault();lenis.stop();gsap.to('#curtain',{scaleY:1,transformOrigin:'bottom',duration:.65,ease:'power3.inOut',onComplete:()=>history.back()});}
window.navigateBack=navigateBack;
window.addEventListener('pageshow',function(e){if(e.persisted){gsap.set('#curtain',{scaleY:1,transformOrigin:'top'});gsap.to('#curtain',{scaleY:0,transformOrigin:'top',duration:.85,ease:'power3.inOut',delay:.05});}});
</script>
</body>
</html>
